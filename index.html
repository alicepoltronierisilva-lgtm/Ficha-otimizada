<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Paranormal - Agente</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent-yellow: #f39c12;
            --accent-gold: #ffcc00;
            --text-color: #c5c6c7;
            --danger-red: #e74c3c;
            --san-blue: #2980b9;
            --pe-green: #2ecc71;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        h1, h2, h3 {
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            border-bottom: 1px solid var(--accent-yellow);
            padding-bottom: 5px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-yellow);
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.2);
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--accent-gold);
        }

        input, select {
            background-color: #0b0c10;
            border: 1px solid var(--accent-yellow);
            color: #fff;
            padding: 8px;
            font-family: inherit;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat-box {
            background-color: #0b0c10;
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }

        .stat-box.pv { border-color: var(--danger-red); }
        .stat-box.san { border-color: var(--san-blue); }
        .stat-box.pe { border-color: var(--pe-green); }

        .stat-box input {
            width: 80%;
            text-align: center;
            font-size: 1.2rem;
        }

        .attributes {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            text-align: center;
            margin-top: 15px;
        }

        .attr-box {
            background-color: #0b0c10;
            border: 1px solid var(--accent-yellow);
            padding: 10px 5px;
        }

        .attr-box input {
            width: 80%;
            text-align: center;
            font-size: 1.1rem;
        }

        /* Rolador de Dados */
        .dice-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .
